# ============================================================
# NESBox Webapp nginx 配置
# 职责:
#   1. 提供前端 SPA 静态资源 (/, /assets/*, /fonts/*, ...)
#   2. 反向代理 GraphQL API 到 server 容器 (/api/* → server:8080/*)
#   3. 支持 WebSocket 订阅 (/api/subscriptions)
#   4. 提供本地化游戏资源 (/files/* → 挂载的 data 目录)
#   5. SPA history fallback (未匹配路由返回 index.html)
# ============================================================

# 上游: docker-compose 内部网络中的 server 服务
upstream nesbox_server {
    server server:8080;
    keepalive 32;
}

# 日志格式: 包含上游响应时间，便于排查性能问题
# 注意: log_format / map 必须位于 http 块（conf.d/*.conf 被 include 到 http 块）
log_format main_ext '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

# WebSocket 升级映射: $http_upgrade 为空时返回 close，避免 nginx 报错
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    access_log /var/log/nginx/access.log main_ext;
    error_log  /var/log/nginx/error.log warn;

    root  /usr/share/nginx/html;
    index index.html;

    # ---------- 通用安全头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- gzip 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2;

    # ============================================================
    # /api/*  →  反向代理到 server:8080/*
    # 前端 API_BASE=/api，所以:
    #   /api/graphql        → server:8080/graphql
    #   /api/guestgraphql   → server:8080/guestgraphql
    #   /api/subscriptions  → server:8080/subscriptions (WebSocket)
    #   /api/playground     → server:8080/playground
    #   /api/webhook        → server:8080/webhook
    # ============================================================
    location /api/ {
        # 尾部斜杠关键: 会剥离 /api 前缀
        proxy_pass http://nesbox_server/;

        proxy_http_version 1.1;

        # WebSocket 升级
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 透传客户端信息
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # GraphQL 订阅 / WebSocket 长连接超时（1 小时）
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 60s;

        # 禁用缓冲，确保 SSE / WebSocket 实时性
        proxy_buffering off;
        proxy_cache off;

        # 请求体大小限制（GraphQL mutation 可能携带 base64 截图）
        client_max_body_size 20m;
    }

    # ============================================================
    # /files/*  →  本地化游戏资源 (ROM / 预览图 / 截图)
    # 由 docker-compose volumes 挂载 ./data 到 /usr/share/nginx/html/files
    # 数据库中 rom/preview/screenshots 字段被替换为 /files/... 相对路径
    #
    # 使用 ^~ 前缀确保优先于正则 location（如 .jpg/.png），
    # 避免 /files/previews/xxx.jpg 被下面的图片缓存规则覆盖
    # ============================================================
    location ^~ /files/ {
        alias /usr/share/nginx/html/files/;

        # 禁用目录索引
        autoindex off;

        # 强缓存: 本地化资源文件名包含 hash，内容稳定
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;

        # 大文件传输优化
        sendfile on;
        tcp_nopush on;

        # 尝试返回文件，不存在则 404
        try_files $uri =404;
    }

    # ============================================================
    # 静态资源缓存策略
    # ============================================================

    # Vite 构建产物: 文件名含 hash，可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # 字体文件: 长期缓存
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
        try_files $uri =404;
    }

    # logo / favicon: 中等缓存
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }

    # WASM 文件: nginx 1.21+ 默认 mime.types 已包含 application/wasm
    # 此处仅设置缓存策略，使用 default_type 作为后备
    location ~* \.wasm$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        default_type application/wasm;
        try_files $uri =404;
    }

    # Service Worker: 禁止缓存，确保更新及时
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
        try_files $uri =404;
    }

    # Web App Manifest: 禁止缓存
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Type "application/manifest+json" always;
        expires 0;
        try_files $uri =404;
    }

    # ============================================================
    # SPA history fallback
    # 所有未匹配的路由返回 index.html，由前端路由处理
    # ============================================================
    location / {
        try_files $uri $uri/ /index.html;

        # index.html 禁止缓存，确保发版后用户立即获取新资源引用
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            expires 0;
        }
    }

    # ============================================================
    # 健康检查端点（供 docker healthcheck / 外部监控使用）
    # ============================================================
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # 隐藏 nginx 版本号
    server_tokens off;
}
